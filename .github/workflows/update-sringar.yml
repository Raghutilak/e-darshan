name: Update Sringar Darshan

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"   # once daily, ~9:30 AM IST — adjust to just before Sringar darshan normally posts
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: update-sringar
  cancel-in-progress: false

jobs:
  update-sringar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright tzdata numpy opencv-python-headless

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Update Sringar with 10-minute retries
        run: |
          for attempt in {1..36}; do
            echo "Attempt $attempt of 36 - $(date -u)"

            if python update_darshan.py sringar; then
              echo "Sringar update succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 36 ]; then
              echo "Sringar photos not ready yet. Waiting 10 minutes..."
              sleep 600
            fi
          done

          echo "Sringar update failed after 36 attempts."
          exit 1

      - name: Commit Sringar photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sringar-1.jpg sringar-2.jpg sringar-3.jpg

          if git diff --cached --quiet; then
            echo "No Sringar changes detected."
          else
            git commit -m "Update Sringar Darshan photos"
            git push
          fi


































