name: Update Sringar Darshan

on:
  workflow_dispatch:

  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  update-sringar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright tzdata numpy opencv-python-headless

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Update Sringar
        run: |
          python update_darshan.py sringar

      - name: Commit Sringar photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sringar-1.jpg sringar-2.jpg sringar-3.jpg

          if git diff --cached --quiet; then
            echo "No Sringar changes detected."
          else
            git commit -m "Update Sringar Darshan photos"
            git push
          fi