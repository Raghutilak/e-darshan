name: Update Mangala Darshan

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: update-mangala
  cancel-in-progress: false

jobs:
  update-mangala:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright tzdata numpy opencv-python-headless

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Update Mangala with 10-minute retries
        run: |
          for attempt in {1..36}; do
            echo "Attempt $attempt of 36 - $(date -u)"

            if python update_darshan.py mangala; then
              echo "Mangala update succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 36 ]; then
              echo "Mangala photos not ready yet. Waiting 10 minutes..."
              sleep 600
            fi
          done

          echo "Mangala update failed after 36 attempts."
          exit 1

      - name: Commit Mangala photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mangala-1.jpg mangala-2.jpg mangala-3.jpg

          if git diff --cached --quiet; then
            echo "No Mangala changes detected."
          else
            git commit -m "Update Mangala Darshan photos"
            git push
          fi