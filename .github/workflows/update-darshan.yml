name: Update Daily Darshan Photos

on:
  workflow_dispatch:

  schedule:
    # 00:30 IST every day = 19:00 UTC previous day
    - cron: "30 19 * * *"

permissions:
  contents: write

jobs:
  update-darshan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright tzdata numpy opencv-python-headless

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Update Darshan photos
        run: |
          python update_darshan.py

      - name: Commit updated photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mangala-1.jpg mangala-2.jpg mangala-3.jpg
          git add sringar-1.jpg sringar-2.jpg sringar-3.jpg

          if git diff --cached --quiet; then
            echo "No photo changes detected."
          else
            git commit -m "Update daily Darshan photos"
            git push
          fi
